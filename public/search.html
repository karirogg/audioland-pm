<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bessi - Leit í handritum</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #ffffff;
      --bg-card: #f8f8f8;
      --bg-card-hover: #f0f0f0;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --text-dim: #666666;
      --accent: #f5a623;
      --accent-dim: #d4900f;
      --success: #22c55e;
      --danger: #ef4444;
      --input-bg: #ffffff;
      --modal-bg: #ffffff;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --bg-light: #121212;
      --bg-card: #1e1e1e;
      --bg-card-hover: #2a2a2a;
      --border: #3a3a3a;
      --text: #f0f0f0;
      --text-dim: #a0a0a0;
      --input-bg: #2a2a2a;
      --modal-bg: #1e1e1e;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-light);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--modal-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 3px var(--shadow);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo img { height: 36px; }
    .logo a { text-decoration: none; }

    .header-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-card-hover);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
    }

    .btn-ghost:hover {
      color: var(--text);
      background: var(--bg-card);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
    }

    .page-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    .search-section {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
    }

    .search-main {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .search-input {
      flex: 1;
      padding: 1rem 1.25rem;
      font-size: 1.1rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      font-family: inherit;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-btn {
      padding: 1rem 2rem;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .search-btn:hover {
      background: var(--accent-dim);
    }

    .filters {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .filter-group label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .filter-group input,
    .filter-group select {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.9rem;
      min-width: 150px;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .result-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }

    .result-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 12px var(--shadow);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .result-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }

    .result-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
    }

    .result-meta span {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .result-excerpt {
      background: var(--bg-card-hover);
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text);
      max-height: 150px;
      overflow: hidden;
      position: relative;
    }

    .result-excerpt::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(transparent, var(--bg-card-hover));
    }

    .result-excerpt mark {
      background: var(--accent);
      color: #000;
      padding: 0.1rem 0.2rem;
      border-radius: 3px;
    }

    .status-badge {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-badge.vinnslu {
      background: var(--accent);
      color: #000;
    }

    .status-badge.bidur {
      background: var(--danger);
      color: #fff;
    }

    .status-badge.lokid {
      background: var(--success);
      color: #fff;
    }

    [data-theme="dark"] .status-badge.vinnslu {
      background: #d4900f;
      color: #fff;
    }

    [data-theme="dark"] .status-badge.bidur {
      background: #c93b3b;
      color: #fff;
    }

    [data-theme="dark"] .status-badge.lokid {
      background: #1a9d4a;
      color: #fff;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-dim);
    }

    .empty-state img {
      width: 80px;
      height: 80px;
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    [data-theme="dark"] .logo img {
      background: var(--text);
      padding: 4px;
      border-radius: 6px;
    }

    [data-theme="dark"] .empty-state img {
      background: var(--text);
      padding: 8px;
      border-radius: 8px;
    }

    .empty-state-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-dim);
    }

    .keyboard-hint {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 0.5rem;
    }

    .keyboard-hint kbd {
      background: var(--bg-card-hover);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-family: inherit;
    }

    /* Responsive - Mobile */
    @media (max-width: 768px) {
      header {
        padding: 0.5rem 1rem;
      }
      .logo img {
        height: 28px;
      }
      .header-actions {
        gap: 0.5rem;
      }
      .header-actions .btn {
        padding: 0.5rem 0.75rem;
        font-size: 0.8rem;
      }

      .container {
        padding: 1rem;
      }
      .page-title {
        font-size: 1.4rem;
      }

      .search-section {
        padding: 1rem;
      }
      .search-main {
        flex-direction: column;
      }
      .search-input {
        font-size: 16px; /* Prevents zoom on iOS */
      }
      .search-btn {
        width: 100%;
      }

      .filters {
        flex-direction: column;
        gap: 0.75rem;
      }
      .filter-group {
        width: 100%;
      }
      .filter-group input,
      .filter-group select {
        width: 100%;
        min-width: auto;
        font-size: 16px;
      }

      .keyboard-hint {
        display: none;
      }

      .result-card {
        padding: 1rem;
      }
      .result-header {
        flex-direction: column;
        gap: 0.5rem;
      }
      .result-meta {
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .result-excerpt {
        font-size: 0.9rem;
        max-height: 120px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <a href="index.html"><img src="logo.jpg" alt="Bessi"></a>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" id="darkModeBtn" onclick="toggleDarkMode()">☀ Ljóst</button>
      <a href="index.html" class="btn btn-secondary">← Til baka</a>
    </div>
  </header>

  <div class="container">
    <h1 class="page-title">Leit í handritum</h1>

    <div class="search-section">
      <div class="search-main">
        <input
          type="text"
          class="search-input"
          id="searchInput"
          placeholder="Leitaðu að orði eða setningu..."
          autofocus
        >
        <button class="search-btn" onclick="doSearch()">Leita</button>
      </div>
      <div class="filters">
        <div class="filter-group">
          <label>Lesari</label>
          <input type="text" id="filterLesari" placeholder="Allir">
        </div>
        <div class="filter-group">
          <label>Stofa</label>
          <input type="text" id="filterStofa" placeholder="Allar">
        </div>
        <div class="filter-group">
          <label>Staða</label>
          <select id="filterStada">
            <option value="">Allar</option>
            <option value="Í vinnslu">Í vinnslu</option>
            <option value="Bíður">Bíður</option>
            <option value="Lokið">Lokið</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Frá</label>
          <input type="date" id="filterFrom">
        </div>
        <div class="filter-group">
          <label>Til</label>
          <input type="date" id="filterTo">
        </div>
      </div>
      <div class="keyboard-hint">
        Ýttu á <kbd>Enter</kbd> til að leita
      </div>
    </div>

    <div id="resultsArea">
      <div class="empty-state">
        <img src="AppLogo.png" alt="Bessi">
        <div class="empty-state-title">Leitaðu í öllum handritum</div>
        <p>Sláðu inn leitarorð til að finna handrit</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let currentQuery = '';
    let sbClient = null;
    let currentSession = null;

    // Get auth header for API calls
    function getAuthHeaders() {
      if (!currentSession?.access_token) return {};
      return {
        'Authorization': 'Bearer ' + currentSession.access_token
      };
    }

    // Fetch with auth
    async function authFetch(url, options = {}) {
      const headers = { ...getAuthHeaders(), ...(options.headers || {}) };
      return fetch(url, { ...options, headers });
    }

    // Initialize Supabase and check auth
    async function initAuth() {
      try {
        const configRes = await fetch('/api/config');
        const config = await configRes.json();

        if (!config.supabaseUrl || !config.supabaseAnonKey) {
          window.location.href = '/login.html';
          return;
        }

        sbClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

        const { data: { session } } = await sbClient.auth.getSession();
        if (!session) {
          window.location.href = '/login.html';
          return;
        }

        currentSession = session;

        sbClient.auth.onAuthStateChange((event, session) => {
          if (event === 'SIGNED_OUT' || !session) {
            window.location.href = '/login.html';
          }
          currentSession = session;
        });
      } catch (err) {
        console.error('Auth villa:', err);
        window.location.href = '/login.html';
      }
    }

    // Dark mode
    let isDarkMode = false;

    function initDarkMode() {
      const saved = localStorage.getItem('dashboard-dark-mode');
      if (saved === 'true') {
        isDarkMode = true;
        document.documentElement.setAttribute('data-theme', 'dark');
        updateDarkModeBtn();
      }
    }

    function toggleDarkMode() {
      isDarkMode = !isDarkMode;
      if (isDarkMode) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      localStorage.setItem('dashboard-dark-mode', isDarkMode);
      updateDarkModeBtn();
    }

    function updateDarkModeBtn() {
      const btn = document.getElementById('darkModeBtn');
      if (isDarkMode) {
        btn.textContent = '☾ Dökkt';
      } else {
        btn.textContent = '☀ Ljóst';
      }
    }

    // Search
    async function doSearch() {
      const q = document.getElementById('searchInput').value.trim();
      if (q.length < 2) {
        document.getElementById('resultsArea').innerHTML = `
          <div class="empty-state">
            <img src="AppLogo.png" alt="Bessi">
            <div class="empty-state-title">Leitarorð of stutt</div>
            <p>Sláðu inn að minnsta kosti 2 stafi</p>
          </div>
        `;
        return;
      }

      currentQuery = q;

      const params = new URLSearchParams({ q });

      const lesari = document.getElementById('filterLesari').value.trim();
      const stofa = document.getElementById('filterStofa').value.trim();
      const stada = document.getElementById('filterStada').value;
      const from = document.getElementById('filterFrom').value;
      const to = document.getElementById('filterTo').value;

      if (lesari) params.append('lesari', lesari);
      if (stofa) params.append('stofa', stofa);
      if (stada) params.append('stada', stada);
      if (from) params.append('from', from);
      if (to) params.append('to', to);

      document.getElementById('resultsArea').innerHTML = '<div class="loading">Leita...</div>';

      try {
        const res = await authFetch('/api/search?' + params.toString());
        const results = await res.json();
        displayResults(results, q);
      } catch (err) {
        console.error(err);
        document.getElementById('resultsArea').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-title">Villa við leit</div>
            <p>${err.message}</p>
          </div>
        `;
      }
    }

    function displayResults(results, query) {
      if (results.length === 0) {
        document.getElementById('resultsArea').innerHTML = `
          <div class="empty-state">
            <img src="AppLogo.png" alt="Bessi">
            <div class="empty-state-title">Ekkert fannst</div>
            <p>Engin handrit fundust með "${escapeHtml(query)}"</p>
          </div>
        `;
        return;
      }

      const html = `
        <div class="results-header">
          <span>${results.length} ${results.length === 1 ? 'niðurstaða' : 'niðurstöður'} fyrir "${escapeHtml(query)}"</span>
        </div>
        ${results.map(r => renderResult(r, query)).join('')}
      `;

      document.getElementById('resultsArea').innerHTML = html;
    }

    function renderResult(r, query) {
      const excerpt = getExcerpt(r.handrit || '', query);
      const stadaClass = r.stada === 'Í vinnslu' ? 'vinnslu' : r.stada === 'Bíður' ? 'bidur' : 'lokid';
      const date = r.mottekid || r.created_at?.split('T')[0] || '';

      return `
        <div class="result-card" onclick="openProject(${r.id})">
          <div class="result-header">
            <div class="result-title">${escapeHtml(r.nafn || 'Ónefnt')}</div>
            <span class="status-badge ${stadaClass}">${r.stada || 'Óþekkt'}</span>
          </div>
          <div class="result-meta">
            ${r.lesari ? `<span>👤 ${escapeHtml(r.lesari)}</span>` : ''}
            ${r.stofa ? `<span>🏢 ${escapeHtml(r.stofa)}</span>` : ''}
            ${date ? `<span>📅 ${formatDate(date)}</span>` : ''}
          </div>
          <div class="result-excerpt">${excerpt}</div>
        </div>
      `;
    }

    function getExcerpt(text, query) {
      if (!text) return '<em>Ekkert handrit</em>';

      const lowerText = text.toLowerCase();
      const lowerQuery = query.toLowerCase();
      const index = lowerText.indexOf(lowerQuery);

      if (index === -1) return escapeHtml(text.substring(0, 300)) + '...';

      // Get surrounding context
      const start = Math.max(0, index - 100);
      const end = Math.min(text.length, index + query.length + 200);

      let excerpt = text.substring(start, end);

      if (start > 0) excerpt = '...' + excerpt;
      if (end < text.length) excerpt = excerpt + '...';

      // Highlight all occurrences of the query
      const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
      excerpt = escapeHtml(excerpt).replace(regex, '<mark>$1</mark>');

      return excerpt;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeRegex(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function formatDate(date) {
      if (!date) return '';
      return new Date(date).toLocaleDateString('is-IS');
    }

    function openProject(id) {
      // Open in main dashboard with the project modal
      window.location.href = 'index.html?open=' + id;
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doSearch();
    });

    // Also search on filter change
    ['filterLesari', 'filterStofa', 'filterStada', 'filterFrom', 'filterTo'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => {
        if (currentQuery) doSearch();
      });
    });

    // Keyboard shortcut - focus search on /
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });

    initDarkMode();
    initAuth();
  </script>
</body>
</html>
