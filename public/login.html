<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bessi - Innskráning</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f5;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --text-dim: #666666;
      --accent: #f5a623;
      --border: #e0e0e0;
      --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-container {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 3rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .logo {
      margin-bottom: 1.5rem;
      font-size: 3rem;
      font-weight: 700;
      color: #f5a623;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-dim);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1.5rem;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      transition: all 0.15s;
      cursor: pointer;
    }

    .google-btn:hover {
      background: #f8f8f8;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .google-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .google-btn svg {
      width: 20px;
      height: 20px;
    }

    .error-message {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--danger);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .signup-note {
      margin-top: 1.5rem;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .footer {
      margin-top: 2rem;
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    .loading {
      display: none;
      margin-top: 1rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">Bessi</div>
    <p class="subtitle">Langar þig í Bessa?</p>

    <div id="errorBox" class="error-message" style="display: none;"></div>

    <button id="loginBtn" class="google-btn" disabled>
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Skrá mig inn
    </button>

    <p class="loading" id="loading">Hleð...</p>

    <p class="signup-note">Nýr? Reikningur stofnast sjálfkrafa.</p>

    <div class="footer">
      Verkefnastjórnun frá Audioland
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let sbClient;

    async function init() {
      const errorBox = document.getElementById('errorBox');
      const btn = document.getElementById('loginBtn');

      try {
        // Get config from server
        console.log('Fetching config...');
        const config = await fetch('/api/config').then(r => r.json());
        console.log('Config:', config);

        if (!config.supabaseUrl || !config.supabaseAnonKey) {
          errorBox.textContent = 'Supabase ekki stillt';
          errorBox.style.display = 'block';
          return;
        }

        console.log('Creating Supabase client...');
        sbClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
        console.log('Supabase client created successfully');

        // Check if already logged in
        console.log('Checking session...');
        const { data: { session }, error: sessionError } = await sbClient.auth.getSession();
        console.log('Session result:', session, sessionError);

        if (session) {
          console.log('User already logged in, redirecting...');
          window.location.href = '/';
          return;
        }

        // Handle OAuth callback
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        if (hashParams.get('access_token')) {
          console.log('OAuth callback detected, redirecting...');
          window.location.href = '/';
          return;
        }

        // Check for error in URL
        const params = new URLSearchParams(window.location.search);
        if (params.get('error')) {
          errorBox.textContent = params.get('error_description') || 'Villa við innskráningu. Reyndu aftur.';
          errorBox.style.display = 'block';
        }

        // Enable button after init
        btn.disabled = false;
        console.log('Init complete, button enabled');
      } catch (err) {
        console.error('Init error:', err);
        errorBox.textContent = 'Villa: ' + err.message;
        errorBox.style.display = 'block';
        // Enable button anyway so user can retry
        btn.disabled = false;
      }
    }

    async function loginWithGoogle() {
      const btn = document.getElementById('loginBtn');
      const loading = document.getElementById('loading');
      const errorBox = document.getElementById('errorBox');

      console.log('Login button clicked');

      if (!sbClient) {
        errorBox.textContent = 'Supabase client ekki tilbúinn. Refresh síðuna.';
        errorBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      loading.style.display = 'block';
      errorBox.style.display = 'none';

      try {
        console.log('Calling signInWithOAuth...');
        const { data, error } = await sbClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: window.location.origin + '/'
          }
        });

        console.log('OAuth result:', data, error);

        if (error) {
          console.error('OAuth error:', error);
          errorBox.textContent = error.message;
          errorBox.style.display = 'block';
          btn.disabled = false;
          loading.style.display = 'none';
        }
      } catch (err) {
        console.error('Login exception:', err);
        errorBox.textContent = 'Villa: ' + err.message;
        errorBox.style.display = 'block';
        btn.disabled = false;
        loading.style.display = 'none';
      }
    }

    document.getElementById('loginBtn').addEventListener('click', loginWithGoogle);
    init();
  </script>
</body>
</html>
