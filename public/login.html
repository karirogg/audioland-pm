<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bessi - Innskráning</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f5;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --text-dim: #666666;
      --accent: #f5a623;
      --border: #e0e0e0;
      --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-container {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 3rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .logo {
      margin-bottom: 1.5rem;
    }

    .logo img {
      height: 80px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-dim);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1.5rem;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      transition: all 0.15s;
      cursor: pointer;
    }

    .google-btn:hover {
      background: #f8f8f8;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .google-btn svg {
      width: 20px;
      height: 20px;
    }

    .error-message {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--danger);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .signup-note {
      margin-top: 1.5rem;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .footer {
      margin-top: 2rem;
      color: var(--text-dim);
      font-size: 0.8rem;
    }
  </style>
</head>
