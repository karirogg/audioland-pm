<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audioland - Verkefnastjórnun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #333333;
      --bg-card: #3d3d3d;
      --bg-card-hover: #474747;
      --border: #4a4a4a;
      --text: #ffffff;
      --text-dim: #aaaaaa;
      --accent: #ED1C24;
      --accent-dim: #c91920;
      --success: #22c55e;
      --warning: #eab308;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: #2a2a2a;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo img {
      height: 32px;
    }

    .logo-text {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
    }

    .logo-subtitle {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-left: 0.5rem;
    }

    .header-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.9rem;
      border: none;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-dim);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-card-hover);
    }

    .btn-danger {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .btn-danger:hover {
      background: var(--accent);
      color: white;
    }

    .btn-small {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 2rem;
    }

    .filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.5rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .verkefni-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 1.5rem;
    }

    .verkefni-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      transition: all 0.2s ease;
    }

    .verkefni-card:hover {
      border-color: var(--accent);
    }

    .verkefni-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .verkefni-nafn {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
    }

    .verkefni-stada {
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .stada-bidur { background: var(--warning); color: #000; }
    .stada-vinnslu { background: var(--accent); color: #fff; }
    .stada-lokid { background: var(--success); color: #fff; }

    .verkefni-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
    }

    .meta-label {
      color: var(--text-dim);
      font-size: 0.75rem;
      margin-bottom: 0.15rem;
    }

    .meta-value {
      color: var(--text);
    }

    .verkefni-handrit {
      background: var(--bg-dark);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      line-height: 1.7;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      border-left: 3px solid var(--accent);
    }

    .verkefni-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .verkefni-actions .btn {
      flex: 1;
      min-width: 90px;
    }

    /* Booth controls í card */
    .booth-controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    .booth-controls select,
    .booth-controls input[type="number"] {
      padding: 0.4rem;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 0.8rem;
    }

    .booth-controls label {
      font-size: 0.75rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto;
      padding: 2rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 750px;
      padding: 2rem;
      margin: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover {
      color: var(--text);
    }

    .form-section {
      margin-bottom: 1.5rem;
    }

    .form-section-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.7rem;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }

    .form-group textarea {
      min-height: 180px;
      resize: vertical;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.6;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-row-3 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1rem;
    }

    .input-with-button {
      display: flex;
      gap: 0.5rem;
    }

    .input-with-button input {
      flex: 1;
    }

    .input-with-button .btn {
      white-space: nowrap;
    }

    .form-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .form-actions .btn {
      flex: 1;
    }

    .booth-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .booth-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }

    .booth-dot.connected {
      background: var(--success);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-dim);
    }

    .empty-state h2 {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    /* Athugasemdir highlight */
    .verkefni-athugasemdir {
      background: rgba(237, 28, 36, 0.1);
      border: 1px solid rgba(237, 28, 36, 0.3);
      border-radius: 6px;
      padding: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: var(--text);
    }

    .verkefni-athugasemdir::before {
      content: "📝 ";
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <svg width="45" height="28" viewBox="0 0 50 30">
        <path d="M2 20 Q8 20 12 8 Q16 -4 20 15 Q24 34 28 15 Q32 -4 36 8 Q40 20 48 20" 
              fill="none" stroke="#ED1C24" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">Audioland</span>
      <span class="logo-subtitle">verkefnastjórnun</span>
    </div>
    <div class="header-actions">
      <div class="booth-status">
        <div class="booth-dot" id="boothDot"></div>
        <span id="boothStatusText">Booth ótengd</span>
      </div>
      <button class="btn btn-secondary" onclick="remoteScrollToggle()" title="Start/Stop scroll í booth">▶ Scroll</button>
      <button class="btn btn-primary" onclick="opnaModal()">+ Nýtt verkefni</button>
    </div>
  </header>

  <div class="container">
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Öll</button>
      <button class="filter-btn" data-filter="Bíður">Bíður</button>
      <button class="filter-btn" data-filter="Í vinnslu">Í vinnslu</button>
      <button class="filter-btn" data-filter="Lokið">Lokið</button>
    </div>

    <div class="verkefni-grid" id="verkefniGrid">
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Nýtt verkefni</h2>
        <button class="modal-close" onclick="lokaModal()">&times;</button>
      </div>

      <form id="verkefniForm">
        <input type="hidden" id="verkefniId">

        <div class="form-section">
          <div class="form-section-title">Grunnupplýsingar</div>
          
          <div class="form-row">
            <div class="form-group">
              <label>Nafn verkefnis *</label>
              <input type="text" id="nafn" required placeholder="t.d. Hagkaup sumarherferð">
            </div>
            <div class="form-group">
              <label>Auglýsingastofa</label>
              <input type="text" id="stofa" placeholder="t.d. Brandenburg" list="stofurList">
              <datalist id="stofurList"></datalist>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Staða</label>
              <select id="stada">
                <option value="Bíður">Bíður</option>
                <option value="Í vinnslu">Í vinnslu</option>
                <option value="Lokið">Lokið</option>
              </select>
            </div>
            <div class="form-group">
              <label>Móttekið</label>
              <input type="date" id="mottekid">
            </div>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">Tengiliðir</div>
          
          <div class="form-row-3">
            <div class="form-group">
              <label>Tengill (nafn)</label>
              <input type="text" id="tengill_nafn" placeholder="Nafn">
            </div>
            <div class="form-group">
              <label>Sími</label>
              <input type="tel" id="tengill_simi" placeholder="000-0000">
            </div>
          </div>

          <div class="form-row-3">
            <div class="form-group">
              <label>Art Director</label>
              <input type="text" id="art_director" placeholder="Nafn">
            </div>
            <div class="form-group">
              <label>Sími</label>
              <input type="tel" id="art_director_simi" placeholder="000-0000">
            </div>
          </div>

          <div class="form-row-3">
            <div class="form-group">
              <label>Copywriter</label>
              <input type="text" id="copywriter" placeholder="Nafn">
            </div>
            <div class="form-group">
              <label>Sími</label>
              <input type="tel" id="copywriter_simi" placeholder="000-0000">
            </div>
          </div>

          <div class="form-group">
            <label>Lesari</label>
            <input type="text" id="lesari" placeholder="Nafn lesara">
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">Handrit</div>
          <div class="form-group">
            <label>Sækja úr Google Docs</label>
            <div class="input-with-button">
              <input type="text" id="googleDocsUrl" placeholder="Líma Google Docs link hér...">
              <button type="button" class="btn btn-secondary btn-small" onclick="saekjaGoogleDoc()">Sækja</button>
            </div>
            <small style="color: var(--text-dim); font-size: 0.75rem;">Skjalið þarf að vera opið fyrir „Anyone with the link"</small>
          </div>
          <div class="form-group">
            <label>Handrit</label>
            <textarea id="handrit" placeholder="Settu handritið hér..."></textarea>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">Athugasemdir</div>
          <div class="form-group">
            <textarea id="athugasemdir" placeholder="Athugasemdir, leiðbeiningar, o.fl." style="min-height: 80px;"></textarea>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title">Tenglar</div>
          
          <div class="form-group">
            <label>Payday tengill/númer</label>
            <input type="text" id="payday_tengill" placeholder="Reikningsnr. eða tengill">
          </div>

          <div class="form-group">
            <label>Dropbox slóð</label>
            <div class="input-with-button">
              <input type="text" id="dropbox_slod" placeholder="/Audioland/Verkefni/...">
              <button type="button" class="btn btn-secondary btn-small" onclick="veljaDropboxMoppu()">Browse...</button>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="lokaModal()">Hætta við</button>
          <button type="submit" class="btn btn-primary">Vista</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let verkefni = [];
    let currentFilter = 'all';

    async function saekjaVerkefni() {
      const res = await fetch('/api/verkefni');
      verkefni = await res.json();
      birtaVerkefni();
    }

    async function saekjaStofur() {
      const res = await fetch('/api/stofur');
      const stofur = await res.json();
      const datalist = document.getElementById('stofurList');
      datalist.innerHTML = stofur.map(s => `<option value="${s.nafn}">`).join('');
    }

    function birtaVerkefni() {
      const grid = document.getElementById('verkefniGrid');
      
      let filtered = verkefni;
      if (currentFilter !== 'all') {
        filtered = verkefni.filter(v => v.stada === currentFilter);
      }

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <h2>Engin verkefni</h2>
            <p>Smelltu á „Nýtt verkefni" til að byrja</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(v => {
        const stadaClass = v.stada === 'Bíður' ? 'stada-bidur' : 
                          v.stada === 'Í vinnslu' ? 'stada-vinnslu' : 'stada-lokid';
        
        return `
          <div class="verkefni-card">
            <div class="verkefni-header">
              <div class="verkefni-nafn">${escapeHtml(v.nafn)}</div>
              <div class="verkefni-stada ${stadaClass}">${v.stada}</div>
            </div>
            
            <div class="verkefni-meta">
              ${v.stofa ? `<div class="meta-item"><span class="meta-label">Stofa</span><span class="meta-value">${escapeHtml(v.stofa)}</span></div>` : ''}
              ${v.lesari ? `<div class="meta-item"><span class="meta-label">Lesari</span><span class="meta-value">${escapeHtml(v.lesari)}</span></div>` : ''}
              ${v.tengill_nafn ? `<div class="meta-item"><span class="meta-label">Tengill</span><span class="meta-value">${escapeHtml(v.tengill_nafn)}${v.tengill_simi ? ' · ' + escapeHtml(v.tengill_simi) : ''}</span></div>` : ''}
              ${v.art_director ? `<div class="meta-item"><span class="meta-label">Art Director</span><span class="meta-value">${escapeHtml(v.art_director)}${v.art_director_simi ? ' · ' + escapeHtml(v.art_director_simi) : ''}</span></div>` : ''}
              ${v.copywriter ? `<div class="meta-item"><span class="meta-label">Copywriter</span><span class="meta-value">${escapeHtml(v.copywriter)}${v.copywriter_simi ? ' · ' + escapeHtml(v.copywriter_simi) : ''}</span></div>` : ''}
            </div>

            ${v.athugasemdir ? `<div class="verkefni-athugasemdir">${escapeHtml(v.athugasemdir)}</div>` : ''}
            
            ${v.handrit ? `<div class="verkefni-handrit">${escapeHtml(v.handrit)}</div>` : ''}
            
            <div class="verkefni-actions">
              <button class="btn btn-primary" onclick="birtaIBooth(${v.id})">📺 Booth</button>
              <button class="btn btn-secondary" onclick="breytaVerkefni(${v.id})">✏️ Breyta</button>
              <button class="btn btn-danger" onclick="eydaVerkefni(${v.id})">🗑️</button>
            </div>

            <div class="booth-controls">
              <label>
                Leturstærð
                <select id="fontSize_${v.id}" onchange="updateBoothSettings(${v.id})">
                  <option value="1">Lítil</option>
                  <option value="2" selected>Miðlungs</option>
                  <option value="3">Stór</option>
                  <option value="4">Mjög stór</option>
                </select>
              </label>
              <label>
                <input type="checkbox" id="autoScroll_${v.id}" onchange="updateBoothSettings(${v.id})">
                Autoscroll
              </label>
              <label>
                Hraði
                <input type="number" id="scrollSpeed_${v.id}" value="50" min="10" max="200" style="width: 60px;" onchange="updateBoothSettings(${v.id})">
              </label>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function opnaModal(id = null) {
      document.getElementById('modalOverlay').classList.add('active');
      document.getElementById('verkefniForm').reset();
      document.getElementById('verkefniId').value = '';
      document.getElementById('modalTitle').textContent = 'Nýtt verkefni';
      document.getElementById('googleDocsUrl').value = '';
      
      if (id) {
        const v = verkefni.find(x => x.id === id);
        if (v) {
          document.getElementById('modalTitle').textContent = 'Breyta verkefni';
          document.getElementById('verkefniId').value = v.id;
          document.getElementById('nafn').value = v.nafn || '';
          document.getElementById('stofa').value = v.stofa || '';
          document.getElementById('tengill_nafn').value = v.tengill_nafn || '';
          document.getElementById('tengill_simi').value = v.tengill_simi || '';
          document.getElementById('art_director').value = v.art_director || '';
          document.getElementById('art_director_simi').value = v.art_director_simi || '';
          document.getElementById('copywriter').value = v.copywriter || '';
          document.getElementById('copywriter_simi').value = v.copywriter_simi || '';
          document.getElementById('lesari').value = v.lesari || '';
          document.getElementById('handrit').value = v.handrit || '';
          document.getElementById('googleDocsUrl').value = v.google_doc_url || '';
          document.getElementById('athugasemdir').value = v.athugasemdir || '';
          document.getElementById('stada').value = v.stada || 'Bíður';
          document.getElementById('payday_tengill').value = v.payday_tengill || '';
          document.getElementById('dropbox_slod').value = v.dropbox_slod || '';
          document.getElementById('mottekid').value = v.mottekid || '';
        }
      }
    }

    function lokaModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function breytaVerkefni(id) {
      opnaModal(id);
    }

    function veljaDropboxMoppu() {
      // Þetta þarf Dropbox API eða native file picker
      // Fyrir núna, sýnum bara alert
      alert('Browse virkni krefst Dropbox API tengingar.\n\nÞú getur afritað slóðina úr Dropbox og límt hér.');
    }

    async function saekjaGoogleDoc() {
      const url = document.getElementById('googleDocsUrl').value.trim();
      
      if (!url) {
        alert('Settu inn Google Docs link');
        return;
      }
      
      if (!url.includes('docs.google.com')) {
        alert('Þetta lítur ekki út eins og Google Docs link');
        return;
      }

      try {
        const res = await fetch('/api/google-docs/fetch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        
        const data = await res.json();
        
        if (data.error) {
          alert(data.error);
          return;
        }
        
        document.getElementById('handrit').value = data.text;
        // Halda URL-inum inni
        
      } catch (error) {
        alert('Villa við að sækja skjal');
        console.error(error);
      }
    }

    document.getElementById('verkefniForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const id = document.getElementById('verkefniId').value;
      const data = {
        nafn: document.getElementById('nafn').value,
        stofa: document.getElementById('stofa').value,
        tengill_nafn: document.getElementById('tengill_nafn').value,
        tengill_simi: document.getElementById('tengill_simi').value,
        art_director: document.getElementById('art_director').value,
        art_director_simi: document.getElementById('art_director_simi').value,
        copywriter: document.getElementById('copywriter').value,
        copywriter_simi: document.getElementById('copywriter_simi').value,
        lesari: document.getElementById('lesari').value,
        handrit: document.getElementById('handrit').value,
        google_doc_url: document.getElementById('googleDocsUrl').value,
        athugasemdir: document.getElementById('athugasemdir').value,
        stada: document.getElementById('stada').value,
        payday_tengill: document.getElementById('payday_tengill').value,
        dropbox_slod: document.getElementById('dropbox_slod').value,
        mottekid: document.getElementById('mottekid').value
      };

      if (id) {
        await fetch(`/api/verkefni/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } else {
        await fetch('/api/verkefni', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      }

      lokaModal();
      saekjaVerkefni();
    });

    async function eydaVerkefni(id) {
      if (!confirm('Ertu viss um að þú viljir eyða þessu verkefni?')) return;
      
      await fetch(`/api/verkefni/${id}`, { method: 'DELETE' });
      saekjaVerkefni();
    }

    async function birtaIBooth(id) {
      const fontSize = document.getElementById(`fontSize_${id}`)?.value || 2;
      const autoScroll = document.getElementById(`autoScroll_${id}`)?.checked || false;
      const scrollSpeed = document.getElementById(`scrollSpeed_${id}`)?.value || 50;

      await fetch('/api/booth/birta', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          verkefni_id: id, 
          take_number: 1,
          fontSize: parseInt(fontSize),
          autoScroll,
          scrollSpeed: parseInt(scrollSpeed)
        })
      });
    }

    async function updateBoothSettings(id) {
      const fontSize = document.getElementById(`fontSize_${id}`)?.value || 2;
      const autoScroll = document.getElementById(`autoScroll_${id}`)?.checked || false;
      const scrollSpeed = document.getElementById(`scrollSpeed_${id}`)?.value || 50;

      await fetch('/api/booth/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          fontSize: parseInt(fontSize),
          autoScroll,
          scrollSpeed: parseInt(scrollSpeed)
        })
      });
    }

    async function remoteScrollToggle() {
      await fetch('/api/booth/scroll-toggle', { method: 'POST' });
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        birtaVerkefni();
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') lokaModal();
    });

    saekjaVerkefni();
    saekjaStofur();
  </script>
</body>
</html>
