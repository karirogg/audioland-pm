<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bessi - Booth</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-header: #f8f8f8;
      --text: #1a1a1a;
      --text-dim: #666666;
      --accent: #f5a623;
      --border: #e0e0e0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Libre Baskerville', Georgia, serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Bíðskjár */
    .standby {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      background: var(--bg);
    }

    .standby.hidden { display: none; }

    .standby-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .standby-logo img { height: 100px; }

    .standby-text {
      font-size: 1.5rem;
      color: var(--text-dim);
      font-style: italic;
    }

    .pulse {
      width: 16px;
      height: 16px;
      background: var(--accent);
      border-radius: 50%;
      margin-top: 3rem;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Handritaskjár */
    .handrit-view {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .handrit-view.active { display: flex; }

    .handrit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      background: var(--bg-header);
      border-bottom: 3px solid var(--accent);
    }

    .header-left { display: flex; flex-direction: column; }

    .verkefni-nafn {
      font-size: 1.2rem;
      color: var(--text);
      font-weight: 600;
      font-family: system-ui, sans-serif;
    }

    .lesari-nafn {
      font-size: 1rem;
      color: var(--text-dim);
      font-family: system-ui, sans-serif;
      margin-top: 0.25rem;
    }

    .take-display {
      background: var(--accent);
      color: #000;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-size: 1.5rem;
      font-weight: 700;
      font-family: system-ui, sans-serif;
    }

    .handrit-content {
      flex: 1;
      overflow-y: auto;
      padding: 3rem 4rem;
      position: relative;
      cursor: pointer;
    }

    .handrit-content.mirrored { transform: scaleX(-1); }

    .handrit-text {
      line-height: 2;
      text-align: center;
      max-width: 1000px;
      margin: 0 auto;
      white-space: pre-wrap;
      font-size: 2.5rem;
      color: var(--text);
    }

    .handrit-text.align-left {
      text-align: left;
    }

    /* Miðjulína */
    .center-line {
      position: fixed;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(0, 0, 0, 0.15);
      pointer-events: none;
      z-index: 5;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }

    .center-line::before,
    .center-line::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 30px;
    }

    .center-line::before {
      bottom: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.08), transparent);
    }

    .center-line::after {
      top: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.08), transparent);
    }

    /* Leturstærðir */
    .font-size-1 .handrit-text { font-size: 1.8rem; line-height: 1.8; }
    .font-size-2 .handrit-text { font-size: 2.5rem; line-height: 1.9; }
    .font-size-3 .handrit-text { font-size: 3.5rem; line-height: 1.8; }
    .font-size-4 .handrit-text { font-size: 5rem; line-height: 1.6; }

    /* Autoscroll indicator */
    .scroll-indicator {
      display: none;
      position: fixed;
      bottom: 80px;
      right: 2rem;
      background: var(--accent);
      color: #000;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-family: system-ui, sans-serif;
      font-size: 0.9rem;
      animation: blink 1s ease-in-out infinite;
    }

    .scroll-indicator.active { display: block; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Status bar */
    .status-bar {
      background: var(--bg-header);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
    }

    .status-dot.connected { background: #22c55e; }

    .status-controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .status-controls button {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.15s;
    }

    .status-controls button:hover {
      background: var(--bg-header);
      border-color: var(--accent);
    }

    .status-controls button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    .separator {
      color: var(--border);
      font-size: 1.5rem;
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.2rem;
    }

    .speed-control button {
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
    }

    .speed-control span {
      min-width: 40px;
      text-align: center;
      font-weight: 600;
      color: var(--text);
    }
  </style>
</head>
<body>
  <!-- Bíðskjár -->
  <div class="standby" id="standby">
    <div class="standby-logo">
      <img src="AppLogo.png" alt="Bessi">
    </div>
    <div class="standby-text">Bíð eftir handriti...</div>
    <div class="pulse"></div>
  </div>

  <!-- Handritaskjár -->
  <div class="handrit-view" id="handritView">
    <div class="handrit-header">
      <div class="header-left">
        <div class="verkefni-nafn" id="verkefniNafn"></div>
        <div class="lesari-nafn" id="lesariNafn"></div>
      </div>
      <div class="take-display">Take <span id="takeNumber">1</span></div>
    </div>
    <div class="handrit-content font-size-2" id="handritContent" onclick="toggleAutoScroll()">
      <div class="handrit-text" id="handritText"></div>
    </div>
  </div>

  <div class="scroll-indicator" id="scrollIndicator">▼ Autoscroll</div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="connection-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Tengist...</span>
    </div>
    <div class="status-controls">
      <button id="fontBtn1" onclick="setFontSize(1)">A</button>
      <button id="fontBtn2" onclick="setFontSize(2)" class="active">A</button>
      <button id="fontBtn3" onclick="setFontSize(3)">A</button>
      <button id="fontBtn4" onclick="setFontSize(4)">A</button>
      <span class="separator">|</span>
      <button id="alignBtn" onclick="toggleAlign()">≡ Miðja</button>
      <span class="separator">|</span>
      <button id="autoScrollBtn" onclick="toggleAutoScroll()">▼ Scroll</button>
      <div class="speed-control">
        <button onclick="changeSpeed(-5)">−</button>
        <span id="speedDisplay">50</span>
        <button onclick="changeSpeed(5)">+</button>
      </div>
      <span class="separator">|</span>
      <div class="speed-control">
        <button onclick="changeTake(-1)">−</button>
        <span>Take <span id="takeDisplay">1</span></span>
        <button onclick="changeTake(1)">+</button>
      </div>
      <span class="separator">|</span>
      <button onclick="toggleMirror()" id="mirrorBtn">⟷ Mirror</button>
      <button onclick="scrollToTop()">↑ Efst</button>
      <button onclick="toggleFullscreen()">⛶</button>
    </div>
  </div>

  <!-- Miðjulína -->
  <div class="center-line" id="centerLine" style="display: none;"></div>

  <script>
    let ws;
    let reconnectInterval;
    let autoScrollInterval = null;
    let currentFontSize = 2;
    let autoScrollActive = false;
    let scrollSpeed = 50;
    let googleDocId = null;
    let googleDocPollInterval = null;
    let isLeftAligned = false;

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/booth-ws`);

      ws.onopen = () => {
        console.log('Tengdist');
        document.getElementById('statusDot').classList.add('connected');
        document.getElementById('statusText').textContent = 'Tengt';
        if (reconnectInterval) {
          clearInterval(reconnectInterval);
          reconnectInterval = null;
        }
      };

      ws.onclose = () => {
        console.log('Aftengt');
        document.getElementById('statusDot').classList.remove('connected');
        document.getElementById('statusText').textContent = 'Aftengt - reyni aftur...';
        
        if (!reconnectInterval) {
          reconnectInterval = setInterval(() => {
            console.log('Reyni að tengjast aftur...');
            connect();
          }, 3000);
        }
      };

      ws.onerror = (err) => console.error('WebSocket villa:', err);

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleMessage(data);
      };
    }

    function handleMessage(data) {
      switch (data.type) {
        case 'handrit':
          showHandrit(data);
          break;
        case 'state':
          if (data.handrit) showHandrit(data);
          if (data.fontSize) setFontSize(data.fontSize, false);
          if (data.autoScroll) {
            autoScrollActive = true;
            scrollSpeed = data.scrollSpeed || 50;
            startAutoScroll();
          }
          break;
        case 'take':
          updateTake(data.take);
          break;
        case 'settings':
          if (data.fontSize) setFontSize(data.fontSize, false);
          if (typeof data.autoScroll !== 'undefined') {
            if (data.autoScroll) {
              scrollSpeed = data.scrollSpeed || scrollSpeed;
              startAutoScroll();
            } else {
              stopAutoScroll();
            }
          }
          break;
        case 'scroll-toggle':
          toggleAutoScroll();
          break;
        case 'scroll-start':
          if (!autoScrollActive) startAutoScroll();
          break;
        case 'scroll-stop':
          if (autoScrollActive) stopAutoScroll();
          break;
        case 'hreinsa':
          showStandby();
          break;
      }
    }

    function showHandrit(data) {
      document.getElementById('standby').classList.add('hidden');
      document.getElementById('handritView').classList.add('active');
      document.getElementById('centerLine').style.display = 'block';
      
      document.getElementById('verkefniNafn').textContent = data.nafn || '';
      document.getElementById('handritText').textContent = data.handrit || '';
      document.getElementById('lesariNafn').textContent = data.lesari ? `Lesari: ${data.lesari}` : '';

      currentTake = data.take || 1;
      document.getElementById('takeNumber').textContent = currentTake;
      document.getElementById('takeDisplay').textContent = currentTake;

      setFontSize(data.fontSize || 2);
      
      if (data.autoScroll) {
        scrollSpeed = data.scrollSpeed || 50;
        startAutoScroll();
      }

      if (data.googleDocId) {
        googleDocId = data.googleDocId;
        startGoogleDocPolling();
      } else {
        googleDocId = null;
        stopGoogleDocPolling();
      }

      scrollToTop();
    }

    function startGoogleDocPolling() {
      stopGoogleDocPolling();
      const docId = googleDocId;
      if (!docId) return;
      
      googleDocPollInterval = setInterval(async () => {
        try {
          const res = await fetch(`/api/google-doc/${docId}`);
          const data = await res.json();
          if (data.content) {
            const currentText = document.getElementById('handritText').textContent;
            if (data.content !== currentText) {
              document.getElementById('handritText').textContent = data.content;
            }
          }
        } catch (err) {
          console.error('Villa við að sækja Google Doc:', err);
        }
      }, 3000);
    }

    function stopGoogleDocPolling() {
      if (googleDocPollInterval) {
        clearInterval(googleDocPollInterval);
        googleDocPollInterval = null;
      }
    }

    function updateTake(take) {
      document.getElementById('takeNumber').textContent = take;
    }

    function showStandby() {
      document.getElementById('standby').classList.remove('hidden');
      document.getElementById('handritView').classList.remove('active');
      document.getElementById('centerLine').style.display = 'none';
      stopAutoScroll();
      stopGoogleDocPolling();
    }

    function setFontSize(size, sendToServer = true) {
      currentFontSize = size;
      const content = document.getElementById('handritContent');
      content.className = 'handrit-content font-size-' + size;
      if (isLeftAligned) content.querySelector('.handrit-text').classList.add('align-left');

      for (let i = 1; i <= 4; i++) {
        document.getElementById('fontBtn' + i).classList.remove('active');
      }
      document.getElementById('fontBtn' + size).classList.add('active');
    }

    function toggleAlign() {
      isLeftAligned = !isLeftAligned;
      const text = document.getElementById('handritText');
      const btn = document.getElementById('alignBtn');
      
      if (isLeftAligned) {
        text.classList.add('align-left');
        btn.textContent = '≡ Vinstri';
        btn.classList.add('active');
      } else {
        text.classList.remove('align-left');
        btn.textContent = '≡ Miðja';
        btn.classList.remove('active');
      }
    }

    function toggleAutoScroll() {
      if (autoScrollActive) {
        stopAutoScroll();
      } else {
        startAutoScroll();
      }
    }

    function startAutoScroll() {
      autoScrollActive = true;
      document.getElementById('autoScrollBtn').classList.add('active');
      document.getElementById('scrollIndicator').classList.add('active');

      if (autoScrollInterval) clearInterval(autoScrollInterval);
      
      const content = document.getElementById('handritContent');
      const interval = Math.max(5, 150 - scrollSpeed);
      
      autoScrollInterval = setInterval(() => {
        content.scrollTop += 1;
        if (content.scrollTop >= content.scrollHeight - content.clientHeight) {
          stopAutoScroll();
        }
      }, interval);
    }

    function stopAutoScroll() {
      autoScrollActive = false;
      document.getElementById('autoScrollBtn').classList.remove('active');
      document.getElementById('scrollIndicator').classList.remove('active');
      
      if (autoScrollInterval) {
        clearInterval(autoScrollInterval);
        autoScrollInterval = null;
      }
    }

    function scrollToTop() {
      document.getElementById('handritContent').scrollTop = 0;
    }

    function changeSpeed(delta) {
      scrollSpeed = Math.max(10, Math.min(300, scrollSpeed + delta));
      document.getElementById('speedDisplay').textContent = scrollSpeed;
      
      if (autoScrollActive) {
        stopAutoScroll();
        startAutoScroll();
      }
    }

    let currentTake = 1;
    
    function changeTake(delta) {
      currentTake = Math.max(1, currentTake + delta);
      document.getElementById('takeDisplay').textContent = currentTake;
      document.getElementById('takeNumber').textContent = currentTake;
    }

    let isMirrored = false;
    function toggleMirror() {
      isMirrored = !isMirrored;
      const content = document.getElementById('handritContent');
      const btn = document.getElementById('mirrorBtn');
      
      if (isMirrored) {
        content.classList.add('mirrored');
        btn.classList.add('active');
      } else {
        content.classList.remove('mirrored');
        btn.classList.remove('active');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    connect();
  </script>
</body>
</html>
